<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteGame - Mis juegos</title>
<link rel="stylesheet" href="/style.css">
<script src="/share.js"></script>
<style>
main.wide{max-width:1280px}
.party{margin-top:2px}
.party summary{cursor:pointer;font-size:13px;color:var(--mut);padding:6px 0;user-select:none}
.party summary b{color:var(--txt);margin-left:4px}
#party{margin-top:4px;padding:8px 12px;font-size:12px;line-height:1.5}
#party .row{margin-top:3px!important;gap:6px}
#party button.copy{padding:3px 9px;font-size:12px}
.lib{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start;margin-top:10px}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.side h2{margin:4px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sys{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.sys:hover:not(:disabled):not(.on){background:#262c44}
.sys.on{background:var(--acc);color:#08122b;font-weight:700}
.sys .n{font-size:12px;color:var(--mut)}
.sys.on .n{color:#08122bbb}
.sys:disabled{opacity:.4;cursor:default}
.bar input{width:100%;background:#0f1220;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.bar input:focus{outline:2px solid var(--acc);outline-offset:1px}
.count{margin:14px 2px 10px;font-size:14px;color:var(--mut)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.shelf.busy{opacity:.55;transition:opacity .15s}
.game{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s,transform .15s}
.game:hover{border-color:var(--acc);transform:translateY(-2px)}
.art{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 45% 26%),hsl(var(--h) 40% 11%))}
.art .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.art .ph b{font-size:58px;line-height:1;color:#ffffffd9}
.art .ph span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ffffffb3}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.art img.ready{opacity:1}
.art img.fill{object-fit:cover}
.art.has .ph{visibility:hidden}
.art.wide::before{content:"";position:absolute;inset:-24px;background:var(--img) center/cover;filter:blur(16px) brightness(.45)}
.info{padding:10px 10px 2px;flex:1}
.info h3{margin:0;font-size:14px;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .meta{margin-top:3px;min-height:1.3em;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{display:block;margin:6px 10px 10px;padding:9px;text-align:center;background:var(--acc);color:#08122b;font-weight:700;font-size:14px;border-radius:8px;text-decoration:none}
.go:hover{filter:brightness(1.1)}
.more{display:block;margin:18px auto 0;padding:10px 22px;background:#2a3050;color:var(--txt);border:1px solid var(--line);border-radius:20px;cursor:pointer;font-size:14px}
.more[hidden]{display:none}
.more:hover:not(:disabled){border-color:var(--acc)}
.more:disabled{opacity:.6;cursor:default}
.others h2{margin:28px 2px 10px;font-size:16px}
.others h2 span{color:var(--mut);font-weight:400;font-size:14px}
.empty{grid-column:1/-1;padding:28px 16px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.empty b{color:var(--txt)}
.upload{margin-top:30px;font-size:13px;color:var(--mut)}
.upload summary{cursor:pointer;user-select:none}
.upload .row{margin-top:8px}
.foot{margin-top:18px;font-size:12px;color:var(--mut)}
#info:empty{display:none}
#info{margin-top:12px;padding:10px 14px;border:1px solid var(--warn);border-radius:10px;color:var(--warn)}
@media (max-width:760px){
  main.wide{padding:12px}
  .lib{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static;flex-direction:row;align-items:center;gap:6px;overflow-x:auto;padding:6px;scrollbar-width:thin}
  .side h2{display:none}
  .sys{width:auto;flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:7px 12px}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .art .ph b{font-size:46px}
}
</style>
</head>
<body>
<header>
  <h1>🎮 RemoteGame</h1>
  <span class="sub">Tus juegos de siempre, directo en el navegador · solos o con un amigo</span>
</header>
<main class="wide">
  <div id="info"></div>

  <details class="party" id="partyBox">
    <summary>👥 Jugar con un amigo <b id="partyState"></b></summary>
    <div class="panel kbd" id="party">Cargando…</div>
  </details>

  <div class="lib">
    <nav class="side" id="side" aria-label="Consolas"><h2>Consolas</h2></nav>
    <section>
      <div class="bar"><input type="search" id="q" placeholder="🔍 Buscá un juego (mario, sonic, metal slug…)" autocomplete="off" aria-label="Buscar juego"></div>
      <div class="count" id="count" aria-live="polite"></div>
      <div id="games" class="shelf"></div>
      <button class="more" id="more" hidden>Ver más</button>
      <div class="others" id="others" hidden>
        <h2>En otras consolas <span id="othersCount"></span></h2>
        <div id="otherGames" class="shelf"></div>
        <button class="more" id="otherMore" hidden>Ver más</button>
      </div>
      <details class="upload">
        <summary>¿Tenés un juego propio? Sumalo a la biblioteca</summary>
        <div class="row">
          <input type="file" id="up" accept=".nes,.zip,.bin,.md,.smd,.gen">
          <button class="copy" id="btnUp">Subir</button>
          <span class="mut" id="upMsg"></span>
        </div>
      </details>
      <div class="foot">Tu carpeta de juegos solo se lee, nunca se modifica. Las portadas vienen de LaunchBox.</div>
    </section>
  </div>
</main>
<script>
var PAGE=96, KEY='remotegame.library';
var HUE={nes:355,genesis:235,arcade:35,snes:275,n64:150,subidos:200};
var systems=[], labels={}, sys='all', query='';
var seq=0, ctl=null, timer=null;
var lists={main:null,other:null};   // loaded games and total per section
var restore=null;
function $(id){return document.getElementById(id);}
function fmt(n){return n.toLocaleString('es-AR');}

// Remember console, search and scroll so "← RemoteGame" brings the same shelf back.
function readSaved(){try{return JSON.parse(sessionStorage.getItem(KEY))||null;}catch(e){return null;}}
function save(){
  try{sessionStorage.setItem(KEY,JSON.stringify({sys:sys,q:query,n:lists.main?lists.main.games:0,y:window.scrollY}));}catch(e){}
}
window.addEventListener('pagehide',save);

function buildSide(){
  var side=$('side');
  side.querySelectorAll('.sys').forEach(function(b){b.remove();});
  var total=0;
  systems.forEach(function(s){if(!s.missing)total+=s.count;});
  var all=[{id:'all',label:'Todas',count:total,off:total===0}].concat(systems.map(function(s){
    return {id:s.id,label:s.label,count:s.count,off:!!s.missing||s.count===0};
  }));
  all.forEach(function(s){
    var b=document.createElement('button');
    b.className='sys'+(s.id===sys?' on':''); b.dataset.id=s.id; b.disabled=s.off;
    b.title=s.off?'No hay juegos en esta consola':'';
    var name=document.createElement('span'); name.textContent=s.label;
    var n=document.createElement('span'); n.className='n'; n.textContent=fmt(s.count);
    b.append(name,n);
    b.onclick=function(){pick(s.id);};
    side.appendChild(b);
  });
}
function pick(id){
  if(id===sys)return;
  sys=id; clearTimeout(timer); query=$('q').value;
  document.querySelectorAll('.sys').forEach(function(b){b.classList.toggle('on',b.dataset.id===sys);});
  save(); load();
}

function card(g,showSys){
  var d=document.createElement('article'); d.className='game';
  var art=document.createElement('a'); art.className='art'; art.href=g.play; art.tabIndex=-1; art.setAttribute('aria-hidden','true');
  art.style.setProperty('--h',HUE[g.system]!=null?HUE[g.system]:210);
  var ph=document.createElement('div'); ph.className='ph';
  var ini=document.createElement('b'); ini.textContent=(g.name.match(/[A-Za-z0-9]/)||['?'])[0].toUpperCase();
  var con=document.createElement('span'); con.textContent=g.systemLabel;
  ph.append(ini,con); art.appendChild(ph);
  if(g.cover){
    var img=document.createElement('img'); img.alt=''; img.loading='lazy'; img.decoding='async';
    img.onload=function(){
      var r=img.naturalWidth/img.naturalHeight;
      if(r>0.6&&r<0.92)img.classList.add('fill');   // box art fills the frame; wide shots stay whole over a blurred copy
      else{art.style.setProperty('--img','url("'+g.cover+'")');art.classList.add('wide');}
      img.classList.add('ready'); art.classList.add('has');
    };
    img.onerror=function(){img.remove();};
    img.src=g.cover; art.appendChild(img);
  }
  var info=document.createElement('div'); info.className='info';
  var h=document.createElement('h3'); h.textContent=g.name; h.title=g.name+' ('+g.file+')';
  var meta=document.createElement('div'); meta.className='meta';
  meta.textContent=[g.year,showSys?g.systemLabel:'',g.variant].filter(Boolean).join(' · ');
  info.append(h,meta);
  var go=document.createElement('a'); go.className='go'; go.href=g.play; go.textContent='▶ Jugar';
  go.setAttribute('aria-label','Jugar '+g.name);
  d.append(art,info,go);
  return d;
}

function fetchList(system,offset,limit,not,signal){
  var url='/api/games?system='+encodeURIComponent(system)+'&q='+encodeURIComponent(query)+'&limit='+limit+'&offset='+offset+(not?'&not='+encodeURIComponent(not):'');
  return fetch(url,{signal:signal}).then(function(x){if(!x.ok)throw new Error('HTTP '+x.status);return x.json();});
}
function fill(kind,r,reset){
  var box=$(kind==='main'?'games':'otherGames'), more=$(kind==='main'?'more':'otherMore');
  if(reset){box.textContent='';lists[kind]={games:0,total:0};}
  var showSys=kind==='other'||sys==='all';
  r.games.forEach(function(g){box.appendChild(card(g,showSys));});
  lists[kind].games+=r.games.length; lists[kind].total=r.total;
  var left=r.total-lists[kind].games;
  more.hidden=left<=0; more.disabled=false;
  more.textContent='Ver más ('+fmt(Math.min(left,PAGE))+' de '+fmt(left)+')';
}
function label(id){return id==='all'?'todas las consolas':(labels[id]||id);}

async function load(){
  var mine=++seq;                               // an older answer arriving late is dropped
  if(ctl)ctl.abort();
  ctl=new AbortController();
  var signal=ctl.signal;
  var keep=restore; restore=null;
  var withOthers=sys!=='all'&&query.trim()!=='';
  $('games').classList.add('busy');
  try{
    var rs=await Promise.all([
      fetchList(sys,0,Math.max(PAGE,keep?Math.min(keep.n||0,1000):0),null,signal),
      withOthers?fetchList('all',0,PAGE,sys,signal):null
    ]);
    if(mine!==seq)return;
    var main=rs[0],other=rs[1];
    $('info').textContent='';
    $('games').classList.remove('busy');
    fill('main',main,true);
    $('others').hidden=!(other&&other.total>0);
    if(other&&other.total>0){fill('other',other,true);$('othersCount').textContent='('+fmt(other.total)+')';}
    else{$('otherGames').textContent='';lists.other=null;}
    var term=query.trim(), empty=main.total===0&&!(other&&other.total>0);
    var c=$('count');
    if(empty){
      c.textContent='';
      var e=document.createElement('div'); e.className='empty';
      if(term){var bq=document.createElement('b'); bq.textContent='“'+term+'”'; e.append('No encontré ',bq,'. Probá con otra palabra.');}
      else e.textContent='Todavía no hay juegos acá.';
      $('games').appendChild(e);
    }else if(!term){
      c.textContent=sys==='all'?fmt(main.total)+' juegos en total':fmt(main.total)+' juegos de '+labels[sys];
    }else if(main.total===0){
      c.textContent='No hay "'+term+'" en '+labels[sys]+', pero mirá lo que hay en otras consolas.';
    }else{
      c.textContent=fmt(main.total)+(main.total===1?' resultado':' resultados')+' en '+label(sys);
    }
    if(keep&&keep.y)window.scrollTo(0,keep.y);
  }catch(e){
    if(e.name==='AbortError'||mine!==seq)return;
    $('games').classList.remove('busy');
    $('info').textContent='No pude cargar los juegos ('+e.message+'). Probá recargar la página.';
  }
}
async function loadMore(kind){
  var mine=seq, list=lists[kind];
  var btn=$(kind==='main'?'more':'otherMore'); btn.disabled=true;
  try{
    var r=kind==='main'?await fetchList(sys,list.games,PAGE,null,ctl&&ctl.signal):await fetchList('all',list.games,PAGE,sys,ctl&&ctl.signal);
    if(mine!==seq||lists[kind]!==list)return;
    fill(kind,r,false);
  }catch(e){
    if(mine===seq){btn.disabled=false;btn.textContent='No se pudo, tocá para reintentar';}
  }
}
$('more').onclick=function(){loadMore('main');};
$('otherMore').onclick=function(){loadMore('other');};

async function init(){
  var r=await fetch('/api/systems').then(function(x){return x.json();});
  systems=r.systems; labels={};
  systems.forEach(function(s){labels[s.id]=s.label;});
  var ok=sys==='all'||systems.some(function(s){return s.id===sys&&!s.missing&&s.count>0;});
  if(!ok)sys='all';
  buildSide();
  await load();
}
var saved=readSaved();
if(saved){sys=saved.sys||'all'; query=saved.q||''; $('q').value=query; restore=saved;}
$('q').addEventListener('input',function(){
  clearTimeout(timer);
  timer=setTimeout(function(){query=$('q').value;save();load();},250);
});
$('btnUp').onclick=async function(){
  var f=$('up').files[0]; if(!f){$('upMsg').textContent='Elegí un archivo primero.';return;}
  var fd=new FormData();fd.append('rom',f);
  $('upMsg').textContent='Subiendo…';
  var r=await fetch('/api/upload',{method:'POST',body:fd}).then(function(x){return x.json();}).catch(function(){return {ok:false};});
  $('upMsg').textContent=r.ok?'¡Listo! Lo encontrás en Subidos.':'No se pudo subir'+(r.msg?': '+r.msg:'.');
  if(r.ok){sys='subidos';query='';$('q').value='';save();init();}
};

// Party box: closed on small screens, and its status stays visible in the title line.
$('partyBox').open=window.matchMedia('(min-width:761px)').matches;
RemoteShare.banner($('party'));
new MutationObserver(function(){
  var b=$('party').querySelector('b');
  $('partyState').textContent=b?b.textContent:'';
}).observe($('party'),{childList:true});
init().catch(function(e){$('info').textContent='No pude cargar la biblioteca ('+e.message+'). Revisá que RemoteGame siga abierto.';});
</script>
</body>
</html>
