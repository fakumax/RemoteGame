<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteGame · Jugar online</title>
<link rel="stylesheet" href="/style.css">
<style>
#wrap{position:relative;width:min(960px,100%);aspect-ratio:4/3;margin:12px auto;background:#000;border-radius:8px;overflow:hidden}
#screen{width:100%;height:100%;object-fit:contain;display:block;image-rendering:pixelated}
#enter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#fff;font-size:20px;font-weight:700;border:0;cursor:pointer;width:100%}
#status{white-space:pre-line}
/* Touch pad, only on phones/tablets */
#touch{display:none;touch-action:none;user-select:none;-webkit-user-select:none;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px auto;max-width:960px}
body.touch #touch{display:grid}
#touch button{background:rgba(42,48,80,.85);color:var(--txt);border:1px solid var(--line);font-weight:700;touch-action:none;pointer-events:none}
#touch .on{background:var(--acc);color:#08122b}
#dpad{position:relative;width:150px;height:150px;border-radius:50%;background:rgba(42,48,80,.6);border:1px solid var(--line);justify-self:start}
#dpad i{position:absolute;font-style:normal;font-size:22px;color:var(--mut);transform:translate(-50%,-50%)}
#mid{display:flex;flex-direction:column;gap:10px}
#mid button{padding:10px 14px;border-radius:10px;font-size:13px}
#face{position:relative;width:170px;height:170px;justify-self:end}
#face button{position:absolute;width:60px;height:60px;border-radius:50%;font-size:18px}
#shoulders{grid-column:1/-1;display:flex;justify-content:space-between}
#shoulders button{width:90px;padding:10px;border-radius:10px}
/* Phone in landscape: video fills the screen and the pad floats over it */
@media (orientation:landscape) and (max-height:520px){
  body.touch header,body.touch .panel{display:none}
  body.touch main{padding:0;max-width:none}
  body.touch #wrap{position:fixed;inset:0;width:100vw;height:100vh;margin:0;border-radius:0;aspect-ratio:auto}
  body.touch #touch{position:fixed;inset:0;margin:0;max-width:none;padding:12px 18px;align-items:end;pointer-events:none}
  body.touch #touch>*{pointer-events:auto}
  body.touch #shoulders{position:fixed;top:10px;left:18px;right:18px}
  body.touch #dpad,body.touch #face button,body.touch #mid button,body.touch #shoulders button{opacity:.55}
}
</style>
<script src="/webrtc.js"></script>
<script src="/pads.js"></script>
</head>
<body>
<header><h1>🎮 RemoteGame</h1><span id="title"></span><span class="pill p2">P2 · invitado</span><span id="net" class="mut"></span><button class="copy" id="full">Pantalla completa</button></header>
<main>
  <div class="panel" id="status">Conectando…</div>
  <div id="wrap"><video id="screen" autoplay playsinline muted></video><button id="enter">▶ Tocá para entrar con sonido</button></div>
  <div id="touch">
    <div id="shoulders"><button data-code="KeyQ">L</button><button data-code="KeyW">R</button></div>
    <div id="dpad"><i style="left:50%;top:16%">▲</i><i style="left:50%;top:84%">▼</i><i style="left:16%;top:50%">◀</i><i style="left:84%;top:50%">▶</i></div>
    <div id="mid"><button data-code="ShiftLeft" data-label="select">SELECT</button><button data-code="Enter">START</button></div>
    <div id="face">
      <button data-code="KeyS" data-label="x" style="left:55px;top:0">X</button>
      <button data-code="KeyA" data-label="y" style="left:0;top:55px">Y</button>
      <button data-code="KeyX" data-label="a" style="left:110px;top:55px">A</button>
      <button data-code="KeyZ" data-label="b" style="left:55px;top:110px">B</button>
    </div>
  </div>
  <div class="panel kbd" id="help">
    <b>Controles (P2):</b> mando USB/Bluetooth, o teclado <kbd>←↑↓→</kbd> · <kbd>Z</kbd> <kbd>X</kbd> <kbd>A</kbd> <kbd>S</kbd> · <kbd>Q</kbd> <kbd>W</kbd> · <kbd>Enter</kbd>=Start · <kbd>Shift</kbd>=Select/Moneda.<br>
    Mando: botón de abajo/derecha/izquierda/arriba = B/A/Y/X (en Neo Geo: A/B/C/D). El juego corre en la PC del anfitrión; acá solo llega el video.
  </div>
</main>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const status=$('status'), video=$('screen');
  const setStatus=text=>{status.textContent=text;};
  const media=new MediaStream();
  video.srcObject=media;
  // Buttons work right away, even while the network setup below is still loading.
  $('enter').onclick=()=>{video.muted=false;video.play().catch(()=>{});$('enter').style.display='none';};
  $('full').onclick=()=>{($('wrap').requestFullscreen||$('wrap').webkitRequestFullscreen).call($('wrap'));};
  const iceServers=await fetch('/api/ice').then(r=>r.json()).catch(()=>undefined);
  let ws=null, rtc=null, analog=false, seq=0, last=null, lastSent=0, keys={};

  const GAME_KEYS=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','ShiftLeft','ShiftRight','KeyZ','KeyX','KeyA','KeyS','KeyQ','KeyW'];
  addEventListener('keydown',e=>{if(GAME_KEYS.includes(e.code))e.preventDefault();if(!keys[e.code]){keys[e.code]=true;poll();}});
  addEventListener('keyup',e=>{keys[e.code]=false;poll();});
  addEventListener('blur',()=>{keys={};poll();});

  // Touch pad: every finger is hit-tested on each move, so sliding between buttons works.
  let touch={};
  const fingers=new Map();
  if(matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0)document.body.classList.add('touch');
  function hitTest(){
    const next={};
    const dpad=$('dpad').getBoundingClientRect();
    const buttons=[...document.querySelectorAll('#touch [data-code]')];
    for(const {x,y} of fingers.values()){
      const dx=x-(dpad.left+dpad.width/2), dy=y-(dpad.top+dpad.height/2), r=dpad.width/2;
      if(Math.hypot(dx,dy)<r*1.3){
        // 8 directions; a small dead zone in the middle.
        if(Math.hypot(dx,dy)>r*0.2){
          const a=Math.atan2(dy,dx)*180/Math.PI;
          if(a>-67.5&&a<67.5)next.ArrowRight=true;
          if(a>112.5||a<-112.5)next.ArrowLeft=true;
          if(a>22.5&&a<157.5)next.ArrowDown=true;
          if(a<-22.5&&a>-157.5)next.ArrowUp=true;
        }
        continue;
      }
      for(const b of buttons){
        const rect=b.getBoundingClientRect(), pad=8;
        if(x>=rect.left-pad&&x<=rect.right+pad&&y>=rect.top-pad&&y<=rect.bottom+pad)next[b.dataset.code]=true;
      }
    }
    for(const b of buttons)b.classList.toggle('on',!!next[b.dataset.code]);
    const pressed=Object.keys(next).some(k=>next[k]&&!touch[k]);
    if(pressed&&navigator.vibrate)navigator.vibrate(8);
    touch=next;poll();
  }
  const onFinger=e=>{
    if(e.pointerType==='mouse'||!e.target.closest('#touch'))return;
    e.preventDefault();
    if(e.type==='pointerup'||e.type==='pointercancel')fingers.delete(e.pointerId);
    else fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    hitTest();
  };
  for(const type of ['pointerdown','pointermove','pointerup','pointercancel'])addEventListener(type,onFinger,{passive:false});
  // Neo Geo/arcade: name the buttons like the cabinet.
  function labelButtons(core){
    const arcade=core==='fbneo'||core==='mame2003';
    const names=arcade?{b:'A',a:'B',y:'C',x:'D',select:'COIN'}:{b:'B',a:'A',y:'Y',x:'X',select:'SELECT'};
    for(const b of document.querySelectorAll('#touch [data-label]'))b.textContent=names[b.dataset.label];
  }

  // Controls travel as full state: a lost packet is fixed by the next one.
  function poll(){
    if(!rtc||!rtc.isOpen())return;
    const pads=navigator.getGamepads?navigator.getGamepads():[];
    const now=RemotePads.readGuest(Object.assign({},keys,touch),pads,analog);
    const t=performance.now();
    if(last&&now.b===last.b&&now.x===last.x&&now.y===last.y&&t-lastSent<50)return;
    rtc.send({t:'pad',s:++seq,b:now.b,x:now.x,y:now.y});
    last=now;lastSent=t;
  }
  setInterval(poll,4);

  async function stats(){
    if(!rtc||!rtc.pc)return;
    const report=await rtc.pc.getStats();let rtt=null,path='',fps=null,buffer=null;
    const candidates={};
    report.forEach(s=>{if(s.type==='local-candidate')candidates[s.id]=s.candidateType;});
    report.forEach(s=>{
      if(s.type==='candidate-pair'&&s.nominated&&s.state==='succeeded'){rtt=s.currentRoundTripTime;path=candidates[s.localCandidateId]==='relay'?'por TURN':'directo';}
      if(s.type==='inbound-rtp'&&s.kind==='video'){fps=s.framesPerSecond;if(s.jitterBufferEmittedCount)buffer=1000*s.jitterBufferDelay/s.jitterBufferEmittedCount;}
    });
    const parts=[];
    if(rtt!=null)parts.push('ida y vuelta '+Math.round(rtt*1000)+' ms');
    if(buffer!=null)parts.push('buffer '+Math.round(buffer)+' ms');
    if(fps!=null)parts.push(Math.round(fps)+' fps');
    if(path)parts.push(path);
    $('net').textContent=parts.join(' · ');
  }
  setInterval(stats,1000);

  let natTimer=null;
  function stopRtc(){
    clearTimeout(natTimer);
    if(rtc){rtc.close();rtc=null;}
    for(const track of media.getTracks())media.removeTrack(track);
  }
  // A fresh answerer per game: the host page that opens a game sends a new offer.
  function startRtc(){
    stopRtc();
    rtc=new RemoteWebRTC({
      isHost:false,iceServers,
      sendSignal:data=>send({t:'signal',data}),
      onTrack:track=>{media.addTrack(track);video.play().catch(()=>{});},
      onOpen:()=>{clearTimeout(natTimer);setStatus('✅ Conectado. Jugás como P2.');seq=0;last=null;poll();},
      onClose:()=>{if(rtc)setStatus('Se cortó el video. Esperando al anfitrión…');}
    });
    rtc.start();
    // No direct route between the two PCs and no TURN relay: nothing will flow.
    natTimer=setTimeout(()=>{if(rtc&&!rtc.isOpen())setStatus('No se pudo conectar directo con el anfitrión (NAT/CGNAT).\nEl anfitrión tiene que configurar un servidor TURN (TURN_URLS en el servidor).');},15000);
  }

  // Permanent room: stay connected and follow whatever game the host opens.
  let replaced=false;
  const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));};
  function connect(){
    ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
    ws.onopen=()=>send({t:'guest'});
    ws.onclose=()=>{
      if(replaced)return;
      if(!rtc||!rtc.isOpen())setStatus('Reconectando con el servidor…');
      setTimeout(connect,2000);
    };
    ws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data);}catch{return;}
      if(m.t==='game'){
        if(!m.game){stopRtc();$('title').textContent='';setStatus('Esperando que el anfitrión abra un juego…');return;}
        analog=m.game.core==='n64';$('title').textContent=m.game.rom;labelButtons(m.game.core);
        setStatus('Cargando '+m.game.rom+'…');startRtc();
      } else if(m.t==='host-left'){stopRtc();setStatus('El anfitrión está cambiando de juego…');}
      else if(m.t==='signal'){rtc&&rtc.handleSignal(m.data);}
      else if(m.t==='replaced'){replaced=true;stopRtc();setStatus('Abriste la sala en otra pestaña o dispositivo. Seguí jugando ahí.');}
      else if(m.t==='error'){setStatus('❌ '+m.msg);}
    };
  }
  connect();
})();
</script>
</body>
</html>
