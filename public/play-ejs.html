<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteGame · Emulador</title>
<link rel="stylesheet" href="/style.css">
<style>
#fsbox{width:min(960px,100%);aspect-ratio:4/3;height:min(720px,75vw);position:relative;margin:12px auto;background:#000}
#gamebox{position:absolute;inset:0;overflow:hidden}
#game{width:100%;height:100%;position:relative}
/* Fullscreen goes to #fsbox (not #game), so the CRT layer and the ping badge stay on top; the picture keeps 4:3. */
#fsbox:fullscreen{width:100%;height:100%;margin:0;display:flex;align-items:center;justify-content:center}
#fsbox:fullscreen #gamebox{position:relative;inset:auto;width:min(100vw,calc(100vh*4/3));height:min(100vh,calc(100vw*3/4))}
select{padding:8px}#status{white-space:pre-line}
</style>
<script src="/webrtc.js"></script>
<script src="/pads.js"></script>
<script src="/share.js"></script>
<script src="/crt.js"></script>
<script src="/hud.js"></script>
</head>
<body>
<header><h1><a href="/">← RemoteGame</a></h1><span id="title"></span><span id="mode" class="pill p1"></span><span id="pad" class="mut"></span></header>
<main>
  <div class="panel row"><label>Emulador <select id="core"></select></label><button class="copy" id="launch">Abrir</button><a class="copy" id="switch" style="text-decoration:none"></a><button class="copy" id="crt"></button></div>
  <div class="panel" id="online" style="display:none">
    <div id="status">Conectando…</div>
    <div id="links" class="kbd"></div>
  </div>
  <div class="panel" id="localStatus" style="display:none"></div>
  <!-- CRT layer sits over #game, outside the canvas the friend's stream is captured from -->
  <div id="fsbox"><div id="gamebox"><div id="game"></div></div></div>
  <div class="panel kbd" id="help"></div>
</main>
<script>
(async function(){
  const qs=new URLSearchParams(location.search), system=qs.get('system')||'genesis', file=qs.get('file')||'';
  // Online by default: the friend's link follows whatever game is open here.
  const online=qs.get('local')!=='1';
  const defaults={nes:'nes',genesis:'segaMD',arcade:'fbneo',snes:'snes',n64:'n64'};
  const choices={nes:'NES / Family',snes:'Super Nintendo',segaMD:'Genesis',n64:'Nintendo 64',fbneo:'Arcade / Neo Geo (FBNeo)',mame2003:'MAME 2003'};
  const $=id=>document.getElementById(id);
  const status=online?$('status'):$('localStatus');
  if(online)$('online').style.display='';else status.style.display='';
  const startHooks=[];
  let started=false;
  try {
    if(!file)throw new Error('Falta el juego. Volvé al inicio.');
    let core=qs.get('core')||defaults[system]||(/\.nes$/i.test(file)?'nes':/\.(bin|md|smd|gen)$/i.test(file)?'segaMD':null);
    const allowed=system==='subidos'?Object.keys(choices):system==='arcade'?['fbneo','mame2003']:[defaults[system]];
    if(core&&!allowed.includes(core))throw new Error('Ese emulador no sirve para este sistema.');
    const select=$('core');
    allowed.filter(Boolean).forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=choices[value];select.appendChild(option);});
    if(core)select.value=core;
    // Never show the raw file name: a tidy one now, the real title as soon as the server answers.
    const setTitle=name=>{$('title').textContent=name;document.title=name+' · RemoteGame';};
    window.setGameTitle=setTitle;
    setTitle(file.replace(/\.[^.]+$/,'').replace(/\s*\[[^\]]*\]/g,'').replace(/\s*\([^)]*\)/g,'').trim()||file);
    fetch('/api/game/'+encodeURIComponent(system)+'/'+encodeURIComponent(file)).then(r=>r.ok?r.json():null).then(g=>{if(g&&g.name)setTitle(g.name);}).catch(()=>{});
    $('mode').textContent=online?'Online · vos sos P1':'2P en esta PC';
    $('launch').onclick=()=>{qs.set('core',select.value);location.search=qs.toString();};
    const other=new URL(location.href);other.searchParams.delete('online');if(online)other.searchParams.set('local','1');else other.searchParams.delete('local');
    $('switch').href=other;$('switch').textContent=online?'Jugar 2P en esta PC':'Volver a online';
    $('help').innerHTML=online
      ?'<b>Tus controles (P1):</b> mando, o teclado <kbd>←↑↓→</kbd> · <kbd>Z</kbd> <kbd>X</kbd> <kbd>A</kbd> <kbd>S</kbd> botones · <kbd>Q</kbd> <kbd>W</kbd> gatillos · <kbd>Enter</kbd> Start · <kbd>Shift</kbd> Select/Moneda.<br>'
       +'<b>Tu amigo (P2)</b> usa siempre el mismo link: ve el juego que abrís acá y cambia solo cuando abrís otro. No instala nada.<br>'
       +'Dejá esta pestaña visible: si la minimizás, el juego se frena para los dos.'
      :'<b>P1:</b> mando 1, o teclado <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · <kbd>F</kbd> <kbd>G</kbd> <kbd>R</kbd> <kbd>T</kbd> botones · <kbd>Q</kbd> <kbd>E</kbd> gatillos · <kbd>1</kbd> Select/Moneda · <kbd>2</kbd> Start.<br>'
       +'<b>P2:</b> mando 2, o teclado <kbd>←↑↓→</kbd> · <kbd>K</kbd> <kbd>L</kbd> <kbd>I</kbd> <kbd>O</kbd> botones · <kbd>U</kbd> <kbd>P</kbd> gatillos · <kbd>Backspace</kbd> Select/Moneda · <kbd>Enter</kbd> Start.<br>'
       +'Mandos: abajo, derecha, izquierda y arriba son B, A, Y y X (en Neo Geo, A, B, C y D).';
    if(core==='n64')$('help').innerHTML+='<br>N64: stick con <kbd>T</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd> y botones C con <kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> (solo P1); P2 solo con mando.';
    $('help').innerHTML+='<br>Si tu mando no aparece arriba, apretá un botón con esta pestaña enfocada (el navegador lo oculta hasta entonces). Con Steam abierto, un mando de PlayStation se ve como uno de Xbox: es normal.';
    if(!core){status.textContent='Elegí el emulador que corresponde a este ZIP y tocá Abrir.';return;}
    RemoteCRT.attach($('gamebox'),$('crt')).setCore(core);

    // The keyboard and pads are read here, not by EmulatorJS (see pads.js), so it gets blank bindings.
    window.EJS_player='#game';window.EJS_gameName=file;window.EJS_core=core;
    window.EJS_gameUrl='/api/rom/'+encodeURIComponent(system)+'/'+encodeURIComponent(file)+'?raw=1';
    window.EJS_pathtodata='https://cdn.emulatorjs.org/4.2.3/data/';
    window.EJS_defaultControls=RemotePads.ejsControls();
    window.EJS_Buttons={gamepad:false};
    window.EJS_noAutoFocus=true;
    window.EJS_alignStartButton='center';window.EJS_language='en-US';window.EJS_disableAutoLang=true;
    window.EJS_startOnLoaded=false;window.EJS_backgroundColor='#14161c';
    window.EJS_onGameStart=()=>{started=true;startHooks.forEach(f=>f());};
    // Bindings saved by an older version would make EmulatorJS read keys and pads again (and, online,
    // hand a second pad to P2, the guest): wipe them, like its "Clear" button, and save that.
    startHooks.push(()=>{
      const ejs=window.EJS_emulator;
      ejs.controls={0:{},1:{},2:{},3:{}};
      if(ejs.checkGamepadInputs)ejs.checkGamepadInputs();
      ejs.saveSettings();
    });
    setupFullscreen();
    setupInput(core);
    if(core==='fbneo'||core==='mame2003') {
      const response=await fetch('/api/arcade-bios');if(!response.ok)throw new Error('No se pudo consultar los BIOS.');
      const bios=await response.json();
      // FBNeo needs neogeo.zip still zipped, next to the ROM.
      if(bios['/neogeo.zip']){window.EJS_biosUrl=bios['/neogeo.zip'];window.EJS_dontExtractBIOS=true;}
      else status.textContent='Falta neogeo.zip en MAME/Roms, que necesitan los juegos de Neo Geo.';
    }
    let h=2166136261;for(const char of system+'|'+core+'|'+file){h^=char.charCodeAt(0);h=Math.imul(h,16777619);}
    window.EJS_gameID=h>>>0;
    if(online)await startHost(system,file,core,status);
    else status.textContent='Tocá Start Game para jugar. El mando 1 es P1 y el 2 es P2.';
    const loader=document.createElement('script');loader.src=window.EJS_pathtodata+'loader.js';
    loader.onerror=()=>{status.textContent='No se pudo cargar EmulatorJS. Revisá tu conexión a Internet.';};
    document.body.appendChild(loader);
  } catch(error){status.textContent=error.message;}

  // EmulatorJS puts its own player element in fullscreen, which leaves the CRT layer and the ping
  // badge outside. Send the fullscreen to the wrapper and tell EmulatorJS (it swaps its icon on this event).
  function setupFullscreen(){
    const box=$('fsbox'), game=$('game');
    game.requestFullscreen=()=>(box.requestFullscreen||box.webkitRequestFullscreen).call(box);
    document.addEventListener('fullscreenchange',e=>{if(e.target===box)game.dispatchEvent(new Event('fullscreenchange',{bubbles:true}));});
  }

  // P1 (and P2 in local mode) from the keyboard and pads. Listening on the window needs no focus, so
  // the arrows work wherever the focus is and never scroll the page.
  function setupInput(core){
    const input=RemotePads.hostInput(core,online,(player,index,value)=>{try{EJS_emulator.gameManager.simulateInput(player,index,value);}catch(e){}});
    const typing=el=>el&&el.closest&&el.closest('input,select,textarea,[contenteditable]');
    addEventListener('keydown',e=>{
      if(e.ctrlKey||e.metaKey||e.altKey||typing(e.target))return;
      const onButton=e.target.closest&&e.target.closest('button,a,summary');
      // Before the game starts Enter must still press "Start Game".
      const mine=started&&input.key(e.code,true);
      if(mine||((e.code.startsWith('Arrow')||e.code==='Space')&&!(e.code==='Space'&&onButton)))e.preventDefault();
    });
    addEventListener('keyup',e=>{input.key(e.code,false);});
    addEventListener('blur',()=>input.release());
    document.addEventListener('visibilitychange',()=>{if(document.hidden)input.release();});
    // Hand the focus back after using our own buttons so Enter/Space do not press them again.
    document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button.copy');if(b)b.blur();});
    let line='', live=[];
    const read=()=>navigator.getGamepads?navigator.getGamepads():[];
    const show=()=>{
      const pads=read(), text=RemotePads.padStatus(pads,live,!online);
      if(text!==line){line=text;$('pad').textContent=text;$('pad').title=Array.from(pads).filter(Boolean).map(g=>g.id).join('\n');}
    };
    setInterval(()=>{live=input.pads(read());},8);
    setInterval(show,400);
    show();
  }

  // Online: this tab emulates and streams video+audio; the guest sends only its controls.
  async function startHost(system,file,core,status){
    const REMOTE_PLAYER=1;
    let video=null, audio=null, scale=1, rtc=null, remote=RemotePads.EMPTY, lastSeq=-1, ws=null, replaced=false;
    const ping=RemoteHUD.ping($('fsbox'));
    RemoteShare.banner($('links'));
    const iceServers=await fetch('/api/ice').then(r=>r.json()).catch(()=>undefined);

    // Tap every connection to the speakers so the game audio can be streamed as well.
    const connect=AudioNode.prototype.connect;
    AudioNode.prototype.connect=function(target,...rest){
      if(target instanceof AudioDestinationNode){
        const ctx=target.context;
        if(!ctx.remoteTap){ctx.remoteTap=ctx.createMediaStreamDestination();audio=ctx.remoteTap.stream.getAudioTracks()[0];rtc&&rtc.setTracks(video,audio,scale);}
        connect.call(this,ctx.remoteTap);
      }
      return connect.call(this,target,...rest);
    };
    startHooks.push(()=>{
      const canvas=window.EJS_emulator&&EJS_emulator.canvas;
      if(canvas&&canvas.captureStream){
        // No frame-rate argument: captures every drawn frame (60), captureStream(60) measured ~37.
        video=canvas.captureStream().getVideoTracks()[0];
        // The canvas is the game upscaled (e.g. 960x720 for 320x240): send the native size.
        scale=Math.max(1,Math.floor(canvas.height/(core==='n64'?480:240)));
        rtc&&rtc.setTracks(video,audio,scale);
      }
      else status.textContent='Este navegador no puede transmitir el juego.';
    });

    const simulate=(index,value)=>{try{EJS_emulator.gameManager.simulateInput(REMOTE_PLAYER,index,value);}catch(e){}};
    const releaseRemote=()=>{RemotePads.applyGuest(remote,RemotePads.EMPTY,simulate);remote=RemotePads.EMPTY;};
    const wsSend=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));};

    function startRtc(){
      if(rtc)rtc.close();
      lastSeq=-1;
      rtc=new RemoteWebRTC({
        isHost:true,media:true,iceServers,
        sendSignal:data=>wsSend({t:'signal',data}),
        onOpen:()=>{status.textContent='✅ Video y controles conectados con tu amigo.';},
        onClose:()=>{releaseRemote();ping.hide();},
        onPing:rtt=>ping.set(rtt),
        onMessage:m=>{
          if(!m||m.t!=='pad'||!Number.isInteger(m.s)||m.s<=lastSeq)return;
          lastSeq=m.s;
          const next={b:(m.b|0)&0xffff,x:Math.max(-127,Math.min(127,m.x|0)),y:Math.max(-127,Math.min(127,m.y|0))};
          RemotePads.applyGuest(remote,next,simulate);remote=next;
        }
      });
      rtc.start().then(()=>rtc.setTracks(video,audio,scale));
    }

    await new Promise((resolve,reject)=>{
      ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
      // One permanent room: opening this game makes it the one the guest sees.
      ws.onopen=()=>{wsSend({t:'host',system,rom:file,core});resolve();};
      ws.onerror=()=>reject(new Error('No se pudo conectar con el servidor.'));
      ws.onclose=()=>{if(!replaced)status.textContent='⚠️ Se perdió la conexión con el servidor. Recargá la página.';};
      ws.onmessage=ev=>{
        let m;try{m=JSON.parse(ev.data);}catch{return;}
        if(m.t==='hosting'){if(m.name)window.setGameTitle(m.name);status.textContent=m.guest?'Tu amigo ya está en la sala. Tocá Start Game para empezar.':'Tocá Start Game para empezar. Tu amigo ve este juego apenas entre al link.';}
        else if(m.t==='peer'){status.textContent='Tu amigo entró. Conectando el video…';startRtc();}
        else if(m.t==='signal'){rtc&&rtc.handleSignal(m.data);}
        else if(m.t==='peer-left'){if(rtc){rtc.close();rtc=null;}releaseRemote();ping.hide();status.textContent='Tu amigo salió. Puede volver a entrar con el mismo link.';}
        else if(m.t==='replaced'){replaced=true;if(rtc){rtc.close();rtc=null;}releaseRemote();ping.hide();status.textContent='Abriste otro juego en otra pestaña y tu amigo ahora ve ese. Cerrá esta pestaña.';}
        else if(m.t==='error'){status.textContent='❌ '+m.msg;}
      };
    });
  }
})();
</script>
</body>
</html>
